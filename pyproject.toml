[project]
# Rename: the distribution name, and the package below (src/example_plugin).
name = "horae-plugin-example"
version = "0.1.0"
description = "An example Horae plugin: one source that proposes a task per message."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "horae-sdk>=0.1,<0.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_plugin"]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7",
    "ruff>=0.17",
    "types-pyyaml>=6",
]

# horae-sdk is not on PyPI yet: it comes from the core repository, pinned to a full commit of
# main (Renovate bumps the rev; run `uv lock` on its pull request). Once horae-sdk is
# published, delete this table: the `horae-sdk` requirement above then resolves from PyPI.
[tool.uv.sources]
horae-sdk = { git = "https://github.com/horae-dev/horae", rev = "7564b08fcbcf9d17d123b5201db97704a929eb20", subdirectory = "sdk" }

[tool.uv]
required-version = ">=0.13"
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["example_plugin"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
